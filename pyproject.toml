[project]
name = "orca-profiles-mcp"
version = "0.1.0"
description = "MCP server that reads and edits OrcaSlicer profiles with full inheritance expansion"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0", "httpx>=0.27"]

[project.scripts]
orca-profiles-mcp = "orca_profiles_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orca_profiles_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not engine'"
markers = ["engine: requires an installed OrcaSlicer, run explicitly"]
